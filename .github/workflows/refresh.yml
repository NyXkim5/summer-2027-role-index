name: Daily refresh

on:
  schedule:
    # 16:00 UTC = 9am Pacific during PDT, 8am during PST.
    # GitHub cron is UTC only and has no DST, so this shifts an hour in November.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep boards and update the index
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 refresh.py --dry-run | tee summary.txt
          else
            python3 refresh.py | tee summary.txt
          fi

      - name: Job summary
        run: |
          {
            echo '## Refresh result'
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the page changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain index.html CHANGELOG.md)" ]; then
            echo "nothing changed, no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)

          $(head -2 summary.txt | tail -1)"
          git push
